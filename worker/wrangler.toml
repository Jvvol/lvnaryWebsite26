# Cloudflare Worker for the LVNARY merch store. Deploy with: npm run worker:deploy
# Secrets are NOT in this file. Set them once with:
#   npx wrangler secret put STRIPE_SECRET_KEY --config worker/wrangler.toml
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET --config worker/wrangler.toml
#   npx wrangler secret put GITHUB_TOKEN --config worker/wrangler.toml
name = "lvnary-store"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Gives the worker a tidy address. Delete this line to use only the free workers.dev address.
routes = [{ pattern = "shop-api.lvnary.com", custom_domain = true }]

[vars]
SITE_ORIGIN = "https://lvnary.com"
ALLOWED_ORIGINS = "https://lvnary.com,https://www.lvnary.com"
GITHUB_REPO = "Jvvol/lvnaryWebsite26"
GITHUB_BRANCH = "main"
# Must be an address on lvnary.com (Cloudflare Email Routing must be on).
ORDER_EMAIL_FROM = "orders@lvnary.com"
# Must be a verified destination in Cloudflare Email Routing.
ORDER_EMAIL_TO = "wearelvnary@gmail.com"
# Seconds a checkout may reuse its last read of the store files. Stock changes always read fresh.
STORE_CACHE_SECONDS = "15"

# Free per-connection limits that don't use KV writes. The period can only be 10 or 60 seconds.
[[ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

[[kv_namespaces]]
binding = "STORE_KV"
id = "b2fb67ca9275441a95b779f45c72fbe0"

[[send_email]]
name = "ORDER_EMAIL"
# Same as ORDER_EMAIL_TO above.
destination_address = "wearelvnary@gmail.com"
